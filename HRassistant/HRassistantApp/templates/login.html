<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SecureAI | Login</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<!-- =========================
     LOGIN PAGE
========================== -->

<main class="login-page">

    <div class="login-card">

        <!-- LOGO -->

        <div class="logo"
             style="text-align: center; color: #241b2f; margin-bottom: 20px;">

            Secure<span>AI</span>

        </div>


        <!-- TITLE -->

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            SecureAI HR Assistant
        </p>


        <!-- ERROR MESSAGE -->

        {% if error %}

            <div class="alert alert-error">
                {{ error }}
            </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit"
                    style="width: 100%;">

                Login

            </button>

        </form>


        <!-- SECURITY NOTICE -->

        <div class="alert alert-info"
             style="margin-top: 20px;">

            🔐 Secure login protected by SecureAI security controls.

        </div>


        <!-- FOOTER -->

        <div class="footer">

            SecureAI
            • Secure HR Platform

        </div>

    </div>

</main>

</body>

</html>
